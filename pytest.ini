[pytest]
DJANGO_SETTINGS_MODULE = blog_cocina.settings.local
python_files = tests.py test_*.py *_tests.py
addopts =
    --strict-markers
    -v
    --tb=short
    --cov=apps
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=70
markers =
    slow: Tests que tocan DB o hacen requests (deselected por defecto en --fast)
