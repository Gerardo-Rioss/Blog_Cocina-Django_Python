{% extends 'base.html' %}
{% block titulo %}Iniciar Sesión{% endblock titulo %}
{% block contenido %}

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle text-primary" style="font-size:3rem;"></i>
                        <h2 class="fw-bold mt-3" style="font-family:var(--font-display);">Bienvenido</h2>
                        <p class="text-muted">Ingresá con tu cuenta</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        {% if messages %}
                            {% for message in messages %}
                            <div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
                                <i class="bi bi-exclamation-triangle me-1"></i>{{ message }}
                                <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                            </div>
                            {% endfor %}
                        {% endif %}
                        
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Usuario</label>
                            <input class="form-control" name="username" type="text" placeholder="Tu usuario" required />
                        </div>                           
                        
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Contraseña</label>
                            <input class="form-control" name="password" type="password" placeholder="••••••••" required />
                        </div>                     
                        
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                        </button>
                        
                        <p class="text-center text-muted small mt-3 mb-0">
                            ¿No tenés cuenta? <a href="{% url 'registro' %}">Registrate</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
