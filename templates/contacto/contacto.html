{% extends 'base.html' %}
{% load static %}

{% block titulo %}Contacto{% endblock titulo %}

{% block contenido %}

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="section-header reveal">
                    <span class="subtitle">Contacto</span>
                    <h2>Escribinos</h2>
                    <div class="divider-line"></div>
                    <p class="text-muted mt-3" style="max-width:500px;margin:12px auto 0;">
                        ¿Tenés una receta para compartir? ¿Consultas, sugerencias? 
                        Completá el formulario y te respondemos a la brevedad.
                    </p>
                </div>

                <div class="card border-0 shadow-sm p-4 reveal">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Nombre completo</label>
                                <input class="form-control" name="nombre" type="text" placeholder="Tu nombre" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Email</label>
                                <input class="form-control" name="email" type="email" placeholder="tu@email.com" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Teléfono</label>
                                <input class="form-control" name="telefono" type="text" placeholder="+54 11 1234-5678" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Asunto</label>
                                <input class="form-control" name="asunto" type="text" placeholder="¿Sobre qué querés hablar?" />
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold">Mensaje</label>
                                <textarea class="form-control" name="mensaje" placeholder="Escribí tu mensaje..." 
                                          style="min-height:150px" required></textarea>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-4">
                            <i class="bi bi-send me-2"></i>Enviar mensaje
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock contenido %}
