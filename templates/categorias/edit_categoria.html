{% extends 'base.html' %}
{% block titulo %}Editar Categoría{% endblock titulo %}
{% block contenido %}

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-pencil-square text-primary" style="font-size:2.5rem;"></i>
                        <h2 class="fw-bold mt-2" style="font-family:var(--font-display);">Editar Categoría</h2>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nombre</label>
                            <input class="form-control" name="descripcion" type="text" value="{{ form.descripcion.value|default:'' }}" required />
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-2"></i>Guardar
                            </button>
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x me-2"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock contenido %}
